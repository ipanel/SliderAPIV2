name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate next patch version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          strict_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git fetch --tags --force
          latest="$(git tag --list | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
          current_version="$(tr -d '\r\n[:space:]' < backend/cmd/server/VERSION)"
          [[ "$current_version" =~ $strict_version ]] || { echo "backend/cmd/server/VERSION must contain a strict X.Y.Z version." >&2; exit 1; }

          # Include legacy GHCR tags without a leading v when choosing the next
          # release so a rebuilt repository cannot publish an older version.
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          registry_token="$(
            curl -fsSL --get \
              --data-urlencode "service=ghcr.io" \
              --data-urlencode "scope=repository:${repository}:pull" \
              https://ghcr.io/token 2>/dev/null | jq -er '.token // .access_token' 2>/dev/null || true
          )"
          registry_latest="$(
            if [[ -n "$registry_token" ]]; then
              curl -fsSL \
                -H "Authorization: Bearer ${registry_token}" \
                "https://ghcr.io/v2/${repository}/tags/list?n=10000" 2>/dev/null |
                jq -r '.tags[]?' 2>/dev/null |
                grep -E '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
                sed 's/^v//' |
                sort -V |
                tail -n 1 || true
            fi
          )"

          resume=false
          if [[ -n "$latest" && "$(git rev-list -n 1 "$latest")" == "$(git rev-parse HEAD)" && "${latest#v}" == "$current_version" ]]; then
            assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${latest}" --jq '.assets[].name' 2>/dev/null || true)"
            for required in ikik-api-linux-amd64.tar.gz ikik-api-linux-arm64.tar.gz checksums.txt; do
              if ! grep -Fxq "$required" <<< "$assets"; then
                resume=true
                break
              fi
            done
          fi

          if [[ "$resume" == "true" ]]; then
            tag="$latest"
          else
            base="$(
              printf '%s\n' "${latest#v}" "$current_version" "$registry_latest" |
                grep -E "$strict_version" |
                sort -V |
                tail -n 1
            )"
            IFS=. read -r major minor patch <<< "$base"
            tag="v${major}.${minor}.$((patch + 1))"
            git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null 2>&1 && { echo "Tag already exists: $tag" >&2; exit 1; }
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"

      - name: Prepare release commit
        if: steps.version.outputs.resume != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION
          git add backend/cmd/server/VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${TAG}"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build Linux archives
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="$(git rev-parse HEAD)"
          for arch in amd64 arm64; do
            stage="release/linux-${arch}"
            mkdir -p "$stage"
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags embed -trimpath -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${commit} -X main.Date=${build_date} -X main.BuildType=release" -o "../${stage}/ikik-api" ./cmd/server)
            cp -R backend/resources "$stage/resources"
            cp deploy/config.example.yaml "$stage/config.example.yaml"
            tar -C "$stage" -czf "release/ikik-api-linux-${arch}.tar.gz" .
          done
          (cd release && sha256sum ikik-api-linux-amd64.tar.gz ikik-api-linux-arm64.tar.gz > checksums.txt)

      - name: Push release commit and tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RESUME: ${{ steps.version.outputs.resume }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if [[ "$RESUME" == "true" ]]; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$(git rev-parse HEAD)" ]] || { echo "Resume tag does not point to the checked-out commit." >&2; exit 1; }
            exit 0
          fi
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1 && { echo "Tag already exists: $TAG" >&2; exit 1; }
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:refs/heads/${DEFAULT_BRANCH}" "refs/tags/${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/ikik-api-linux-amd64.tar.gz
            release/ikik-api-linux-arm64.tar.gz
            release/checksums.txt

  ghcr:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
