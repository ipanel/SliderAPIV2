name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag --list | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
          if [[ -n "$latest" ]]; then
            base="${latest#v}"
          else
            base="$(tr -d '\r\n[:space:]' < backend/cmd/server/VERSION)"
            [[ "$base" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || base="0.0.0"
          fi
          IFS=. read -r major minor patch <<< "$base"
          tag="v${major}.${minor}.$((patch + 1))"
          git rev-parse "$tag" >/dev/null 2>&1 && { echo "Tag already exists: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Update version and create tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION
          git add backend/cmd/server/VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${TAG}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
          git fetch --tags --force
          git rev-parse "$TAG" >/dev/null 2>&1 && { echo "Tag already exists: $TAG" >&2; exit 1; }
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build Linux archives
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            stage="release/linux-${arch}"
            mkdir -p "$stage"
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -tags embed -trimpath -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${build_date} -X main.BuildType=release" -o "../${stage}/ikik-api" ./cmd/server)
            cp -R backend/resources "$stage/resources"
            cp deploy/config.example.yaml "$stage/config.example.yaml"
            tar -C "$stage" -czf "release/ikik-api-linux-${arch}.tar.gz" .
          done
          (cd release && sha256sum ikik-api-linux-amd64.tar.gz ikik-api-linux-arm64.tar.gz > checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/ikik-api-linux-amd64.tar.gz
            release/ikik-api-linux-arm64.tar.gz
            release/checksums.txt

  ghcr:
    needs: release
    uses: ./.github/workflows/ghcr.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
