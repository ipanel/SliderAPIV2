name: GHCR Multi-Architecture Image

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build
        required: false
        type: string
        default: ''
    secrets:
      GHCR_TOKEN:
        description: Optional classic PAT with write:packages for an existing unlinked package
        required: false
      GHCR_USERNAME:
        description: Username that owns GHCR_TOKEN; must be configured together with GHCR_TOKEN
        required: false
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release tag and image
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag="$INPUT_TAG"
          [[ -n "$tag" ]] || tag="$(git tag --list | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "No strict vX.Y.Z release tag was found." >&2; exit 1; }
          git checkout --detach "refs/tags/${tag}"
          image="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate optional GHCR credentials
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$GHCR_USERNAME" && -z "$GHCR_TOKEN" ]] || [[ -z "$GHCR_USERNAME" && -n "$GHCR_TOKEN" ]]; then
            echo "GHCR_USERNAME and GHCR_TOKEN must be configured together." >&2
            exit 1
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.version.outputs.commit }}
            DATE=${{ steps.version.outputs.date }}
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Promote newest release to latest
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ steps.version.outputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          repository="${IMAGE#ghcr.io/}"
          registry_token="$(
            curl -fsSL --user "${GHCR_USERNAME}:${GHCR_TOKEN}" --get \
              --data-urlencode "service=ghcr.io" \
              --data-urlencode "scope=repository:${repository}:pull" \
              https://ghcr.io/token | jq -er '.token // .access_token'
          )"
          newest_version="$(
            curl -fsSL \
              -H "Authorization: Bearer ${registry_token}" \
              "https://ghcr.io/v2/${repository}/tags/list?n=10000" |
              jq -r '.tags[]?' |
              grep -E '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sed 's/^v//' |
              sort -V |
              tail -n 1
          )"
          candidate="${TAG#v}"
          if [[ -z "$newest_version" || "$candidate" != "$newest_version" ]]; then
            echo "Skip latest promotion: ${TAG} is older than the newest GHCR version (${newest_version:-unknown})."
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${TAG}"
