# =============================================================================
# ikik-api Docker Compose - Local Development Build + MariaDB
# =============================================================================
# Build from local source code for testing changes.
#
# Usage:
#   cd deploy
#   cp .env.example .env
#   # Set MARIADB_ROOT_PASSWORD and MARIADB_PASSWORD in .env first.
#   docker compose -f docker-compose.dev.mysql.yml up --build
# =============================================================================

services:
  ikik-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ikik-api-dev
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - AUTO_SETUP=${AUTO_SETUP:-false}
      - DATA_DIR=/app/data
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=debug
      - RUN_MODE=${RUN_MODE:-standard}
      - SETUP_DATABASE_DRIVER=mysql
      - SETUP_DATABASE_HOST=mariadb
      - SETUP_DATABASE_PORT=3306
      - SETUP_DATABASE_USER=${MARIADB_USER:-ikik_api}
      - SETUP_DATABASE_PASSWORD=${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
      - SETUP_DATABASE_DBNAME=${MARIADB_DATABASE:-ikik_api}
      - SETUP_DATABASE_SSLMODE=disable
      - DATABASE_MAX_OPEN_CONNS=${DATABASE_MAX_OPEN_CONNS:-50}
      - DATABASE_MAX_IDLE_CONNS=${DATABASE_MAX_IDLE_CONNS:-10}
      - DATABASE_CONN_MAX_LIFETIME_MINUTES=${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      - DATABASE_CONN_MAX_IDLE_TIME_MINUTES=${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      - SETUP_REDIS_HOST=redis
      - SETUP_REDIS_PORT=6379
      - SETUP_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SETUP_REDIS_DB=${REDIS_DB:-0}
      - SETUP_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ikik-api.local}
      - SETUP_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SETUP_MIGRATION_TIMEOUT_SECONDS=${SETUP_MIGRATION_TIMEOUT_SECONDS:-0}
      - JWT_SECRET=${JWT_SECRET:-}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - TZ=${TZ:-Asia/Shanghai}
      - GEMINI_OAUTH_CLIENT_ID=${GEMINI_OAUTH_CLIENT_ID:-}
      - GEMINI_OAUTH_CLIENT_SECRET=${GEMINI_OAUTH_CLIENT_SECRET:-}
      - GEMINI_OAUTH_SCOPES=${GEMINI_OAUTH_SCOPES:-}
      - GEMINI_CLI_OAUTH_CLIENT_ID=${GEMINI_CLI_OAUTH_CLIENT_ID:-}
      - GEMINI_CLI_OAUTH_CLIENT_SECRET=${GEMINI_CLI_OAUTH_CLIENT_SECRET:-}
      - ANTIGRAVITY_OAUTH_CLIENT_ID=${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      - ANTIGRAVITY_OAUTH_CLIENT_SECRET=${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ikik-api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mariadb:
    image: mariadb:10.11.14
    container_name: ikik-api-mariadb-dev
    restart: unless-stopped
    volumes:
      - ./mariadb_data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-ikik_api}
      - MARIADB_USER=${MARIADB_USER:-ikik_api}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      - ikik-api-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: ikik-api-redis-dev
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    command: >
        sh -c '
          redis-server
          --save 60 1
          --appendonly yes
          --appendfsync everysec
          $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # REDISCLI_AUTH is used by redis-cli for authentication (safer than -a flag)
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    networks:
      - ikik-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  ikik-api-network:
    driver: bridge
